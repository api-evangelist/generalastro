aid: generalastro
name: Generalastro
description: >-
  General Astronautics (Generalastro) is a Y Combinator (W26) space-robotics company founded in 2025 by
  Bram Schork, based in San Francisco, building autonomous dexterous robotic arms that perform laboratory
  research and manufacturing tasks in microgravity without astronaut intervention. Its systems handle work
  like pipetting, sample prep, plate handling, and reagent mixing, targeting microgravity production of
  pharmaceuticals, semiconductors, and fiber optics where crew time on orbital stations is the bottleneck
  (NASA estimates ISS crew time at ~$130K/hour). The company is pre-product hardware, backed by Y Combinator
  and Planet Ventures (~$7.1M raised), and currently exposes no public API, developer portal, documentation,
  SDK, or other machine-readable surface; this profile captures company identity only.
